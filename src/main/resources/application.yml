spring:
  application:
    name: cargo-shipment-platform

  # ==========================================================
  # PostgreSQL
  # ==========================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/pms
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: PmsHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000


  # ==========================================================
  # JPA / Hibernate
  # ==========================================================
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

    show-sql: false

  # ==========================================================
  # Flyway
  # ==========================================================
  flyway:
    enabled: true

    locations:
      - classpath:db/migration

    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true