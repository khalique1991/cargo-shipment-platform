spring:
  application:
    name: cargo-shipment-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/cargo_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true

  security:

    # Existing Resource Server configuration.
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/cargo-platform

      # New OAuth2 Client configuration.
      client:

        registration:

          # Internal registration name.
          cargo-booking-client:

            # Keycloak client ID.
            client-id: cargo-shipment-service

            # Read secret from an environment variable.
            client-secret: ${CARGO_SHIPMENT_CLIENT_SECRET}

            # Machine-to-machine authentication.
            authorization-grant-type: client_credentials

            # Keycloak authentication method.
            client-authentication-method: client_secret_post

            # Connect this registration to the provider below.
            provider: keycloak

        provider:

          keycloak:
            issuer-uri: http://localhost:8081/realms/cargo-platform
            token-uri: http://localhost:9999/mock-token-endpoint


springdoc:
  swagger-ui:
    oauth:
      client-id: cargo-shipment-swagger
      use-pkce-with-authorization-code-grant: true
app:
  cors:
    allowed-origins: http://localhost:3000
server:
  port: 8080